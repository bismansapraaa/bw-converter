<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black &amp; White</title>
<style>
  :root { --paper:#f2f2f0; --ink:#141414; --mid:#8a8a87; --line:#d4d4d0; }
  @media (prefers-color-scheme: dark) { :root { --paper:#141414; --ink:#f2f2f0; --mid:#8f8f8c; --line:#333; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family: Georgia, "Times New Roman", serif; line-height:1.5; }
  main { max-width: 560px; margin: 0 auto; padding: 56px 20px 80px; }
  h1 { font-size: 2.6rem; font-weight: 400; letter-spacing: -0.02em; margin: 0 0 8px; }
  p.lead { color: var(--mid); margin: 0 0 32px; }
  #drop { border: 1.5px dashed var(--ink); padding: 40px 20px; text-align: center; cursor: pointer; transition: background .15s; }
  #drop.over { background: var(--ink); color: var(--paper); }
  #drop small { display:block; color: var(--mid); margin-top: 6px; }
  #drop.over small { color: var(--paper); }
  #summary { margin: 12px 0 0; min-height: 1.5em; }
  label { display:block; margin: 28px 0 6px; }
  input[type=email], select { width:100%; padding: 12px; font: inherit; background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 0; }
  button { margin-top: 28px; width:100%; padding: 14px; font: inherit; background: var(--ink); color: var(--paper); border: 0; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  progress { width:100%; height: 6px; margin-top: 20px; display:none; accent-color: var(--ink); }
  #status { margin-top: 16px; }
  #status.error { text-decoration: underline wavy; }
</style>
</head>
<body>
<main>
  <h1>Black &amp; White</h1>
  <p class="lead">Upload photos and videos. We convert them and email you the results.</p>

  <div id="drop" tabindex="0" role="button" aria-label="Choose photos and videos">
    Drop photos and videos here, or click to choose
    <small>JPG, PNG, WebP, MP4, MOV, and more</small>
  </div>
  <input type="file" id="files" multiple accept="image/*,video/*" hidden>
  <div id="summary"></div>

  <label for="mode">Style</label>
  <select id="mode">
    <option value="grayscale">Grayscale (shades of gray)</option>
    <option value="binary">Pure black and white (photos only)</option>
  </select>

  <label for="email">Your email</label>
  <input type="email" id="email" placeholder="you@example.com" autocomplete="email">

  <button id="go">Convert and email me</button>
  <progress id="bar" max="100" value="0"></progress>
  <div id="status" role="status"></div>
</main>

<script>
const drop = document.getElementById('drop'), input = document.getElementById('files');
const summary = document.getElementById('summary'), statusEl = document.getElementById('status');
const bar = document.getElementById('bar'), go = document.getElementById('go');
let chosen = [];

function setFiles(list) {
  chosen = Array.from(list);
  const mb = chosen.reduce((s, f) => s + f.size, 0) / 1048576;
  summary.textContent = chosen.length ? `${chosen.length} file(s), ${mb.toFixed(1)} MB` : '';
}
drop.onclick = () => input.click();
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') input.click(); };
input.onchange = () => setFiles(input.files);
['dragover','dragenter'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => setFiles(e.dataTransfer.files));

function show(msg, isError) { statusEl.textContent = msg; statusEl.className = isError ? 'error' : ''; }

go.onclick = () => {
  const email = document.getElementById('email').value.trim();
  if (!chosen.length) return show('Choose at least one photo or video.', true);
  if (!email) return show('Enter your email address.', true);

  const fd = new FormData();
  chosen.forEach(f => fd.append('files', f));
  fd.append('email', email);
  fd.append('mode', document.getElementById('mode').value);

  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/upload');
  xhr.upload.onprogress = e => { if (e.lengthComputable) bar.value = (e.loaded / e.total) * 100; };
  xhr.onload = () => {
    go.disabled = false;
    let res = {}; try { res = JSON.parse(xhr.responseText); } catch (_) {}
    if (xhr.status === 200) { bar.style.display = 'none'; show(`Uploaded ${res.count} file(s). Check your email in a few minutes. You can close this page.`); }
    else show(res.error || 'Upload failed. Try again.', true);
  };
  xhr.onerror = () => { go.disabled = false; show('Could not reach the server.', true); };
  go.disabled = true; bar.style.display = 'block'; bar.value = 0; show('Uploading...');
  xhr.send(fd);
};
</script>
</body>
</html>
