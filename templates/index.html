<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo &amp; Video to Black &amp; White</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --line: #cfcfcf;
    --panel: #f3f3f3;
    --accent: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161616;
      --ink: #f2f2f2;
      --muted: #9a9a9a;
      --line: #3a3a3a;
      --panel: #202020;
      --accent: #f2f2f2;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main { width: 100%; max-width: 560px; text-align: center; }
  h1 { font-size: clamp(2rem, 6vw, 3rem); font-weight: 400; margin: 0 0 12px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 32px; font-size: 1.05rem; line-height: 1.5; }

  .drop {
    display: block;
    border: 2px dashed var(--line);
    background: var(--panel);
    padding: 56px 24px;
    cursor: pointer;
    filter: grayscale(1);
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); }
  .drop:focus-within { outline: 3px solid var(--accent); outline-offset: 3px; }
  .drop strong { display: block; font-size: 1.25rem; font-weight: 400; margin-bottom: 6px; }
  .drop span { color: var(--muted); font-size: .95rem; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }

  .status { margin-top: 28px; min-height: 3.5em; }
  .status p { margin: 0 0 12px; font-size: 1.05rem; }
  .bar { height: 4px; background: var(--line); overflow: hidden; display: none; }
  .bar i { display: block; height: 100%; width: 35%; background: var(--accent); animation: slide 1.2s linear infinite; }
  @keyframes slide { from { margin-left: -35%; } to { margin-left: 100%; } }
  @media (prefers-reduced-motion: reduce) { .bar i { animation: none; width: 100%; opacity: .4; } }

  .btn {
    display: none;
    margin-top: 8px;
    padding: 12px 28px;
    background: var(--accent);
    color: var(--bg);
    text-decoration: none;
    font-size: 1rem;
  }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Make it black &amp; white</h1>
  <p class="sub">Choose a photo or a video. It converts here and downloads on its own when it is ready.</p>

  <label class="drop" id="drop">
    <input type="file" id="video" accept="image/*,video/*">
    <strong>Select a photo or video</strong>
    <span>or drop it here</span>
  </label>

  <div class="status" aria-live="polite">
    <p id="msg"></p>
    <div class="bar" id="bar"><i></i></div>
    <a id="dl" class="btn">Download again</a>
  </div>
</main>

<script>
const input = document.getElementById("video");
const drop = document.getElementById("drop");
const msg = document.getElementById("msg");
const bar = document.getElementById("bar");
const dl = document.getElementById("dl");

input.addEventListener("change", () => start(input.files[0]));

["dragenter", "dragover"].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => start(e.dataTransfer.files[0]));

function fail(text) {
  bar.style.display = "none";
  msg.textContent = text;
}

async function start(file) {
  if (!file) return;
  if (!file.type.startsWith("video/") && !file.type.startsWith("image/")) { fail("Please choose a photo or a video."); return; }

  dl.style.display = "none";
  bar.style.display = "block";
  msg.textContent = "Uploading " + file.name + "…";

  const fd = new FormData();
  fd.append("file", file);

  let job_id;
  try {
    const res = await fetch("/upload", { method: "POST", body: fd });
    if (!res.ok) throw new Error();
    job_id = (await res.json()).job_id;
  } catch (e) {
    fail("Upload failed. Use a JPG, PNG, WEBP, MP4 or MOV file, or try a smaller one.");
    return;
  }

  msg.textContent = "Converting to black & white…";

  const timer = setInterval(async () => {
    try {
      const s = await (await fetch("/status/" + job_id)).json();
      if (s.status === "done") {
        clearInterval(timer);
        bar.style.display = "none";
        msg.textContent = "Done. Your download is starting.";
        dl.href = "/download/" + job_id;
        dl.style.display = "inline-block";
        window.location.href = "/download/" + job_id;
      } else if (s.status === "error") {
        clearInterval(timer);
        fail("Conversion failed. Try a smaller file.");
      }
    } catch (e) { /* keep polling; the server may be busy */ }
  }, 2000);
}
</script>
</body>
</html>
